<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Gallery — Forytography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Newsreader:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF1EA; --paper:#F8F7F2; --ink:#1F2620; --ink-soft:#4B5449;
    --gold:#C99A3B; --sage:#6B7A5E; --line:#C9C6BC;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Newsreader', serif;
  }
  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing:0.08em; text-transform:uppercase; }

  /* ---- Lock screen ---- */
  .lock-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .lock-card{
    max-width:420px; width:100%; background:var(--paper);
    border:1px solid var(--line); padding:48px 40px; text-align:center;
  }
  .lock-card h1{
    font-family:'Big Shoulders Display', sans-serif; text-transform:uppercase;
    font-weight:900; font-size:34px; margin:16px 0 8px; line-height:0.95;
  }
  .lock-card p{ color:var(--ink-soft); font-size:15px; line-height:1.6; }
  input[type="password"], input[type="text"]{
    width:100%; padding:14px; margin-top:20px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:14px; letter-spacing:0.05em;
    text-align:center;
  }
  .unlock-btn{
    width:100%; margin-top:14px; padding:14px;
    background:var(--ink); color:var(--paper); border:none;
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; cursor:pointer; transition:background .2s;
  }
  .unlock-btn:hover{ background:var(--sage); }
  .unlock-btn[disabled]{ opacity:0.6; cursor:wait; }
  .error-msg{ color:#a14a3a; font-size:12px; margin-top:14px; font-family:'JetBrains Mono', monospace; }

  /* ---- Gallery view ---- */
  .gallery-wrap{ display:none; padding:100px 24px 80px; max-width:1180px; margin:0 auto; }
  .gallery-header{ text-align:center; margin-bottom:48px; }
  .gallery-header .eyebrow{ color:var(--sage); font-size:11px; }
  .gallery-header h1{
    font-family:'Big Shoulders Display', sans-serif; text-transform:uppercase;
    font-weight:900; font-size:clamp(36px,6vw,64px); margin:10px 0 0;
  }

  /* Masonry columns — each photo keeps its own natural aspect ratio (landscape or portrait) */
  .gallery-grid{ column-count:3; column-gap:16px; }
  @media (max-width:900px){ .gallery-grid{ column-count:2; } }
  @media (max-width:560px){ .gallery-grid{ column-count:1; } }

  .photo-card{
    position:relative; background:var(--ink); overflow:hidden;
    margin-bottom:16px; break-inside:avoid; cursor:zoom-in;
  }
  .photo-card img{
    width:100%; height:auto; display:block;
    transition:transform .5s cubic-bezier(.2,.7,.3,1), filter .5s;
  }
  .photo-card:hover img{ transform:scale(1.03); filter:brightness(1.03); }
  .photo-card.loading{
    aspect-ratio:3/2;
    background:linear-gradient(90deg, #dcdcd4 25%, #eceae2 37%, #dcdcd4 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  .photo-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(10,12,9,0.4); opacity:0; transition:opacity .2s;
  }
  .photo-card:hover .photo-overlay{ opacity:1; }
  .download-btn{
    background:var(--gold); color:#241C0D; border:none;
    padding:12px 20px; font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
  }

  /* ---- Lightbox ---- */
  .lightbox{
    position:fixed; inset:0; z-index:1000;
    background:rgba(12,14,10,0.94);
    display:flex; align-items:center; justify-content:center;
    padding:5vh 5vw;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease;
  }
  .lightbox.active{ opacity:1; visibility:visible; }
  .lightbox img{
    max-width:90vw; max-height:88vh;
    width:auto; height:auto;
    object-fit:contain;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    transform:scale(0.97);
    transition:transform .25s ease;
    cursor:zoom-out;
  }
  .lightbox.active img{ transform:scale(1); }
  .lightbox-close{
    position:absolute; top:22px; right:clamp(20px,4vw,40px);
    width:42px; height:42px; border-radius:50%;
    background:transparent; border:1px solid rgba(233,230,218,0.4);
    color:#E9E6DA; font-size:20px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, border-color .2s;
  }
  .lightbox-close:hover{ background:rgba(233,230,218,0.12); border-color:#E9E6DA; }
</style>
</head>
<body>

  <div class="lock-wrap" id="lockWrap">
    <div class="lock-card">
      <span class="mono" style="color:var(--sage); font-size:11px;">Private Gallery</span>
      <h1>Forytography</h1>
      <p>Enter the passkey you were given to view and download your photos.</p>
      <input type="password" id="passkeyInput" placeholder="Passkey" autocomplete="off">
      <button class="unlock-btn mono" id="unlockBtn">View Gallery</button>
      <p class="error-msg" id="errorMsg" style="display:none;"></p>
    </div>
  </div>

  <div class="gallery-wrap" id="galleryWrap">
    <div class="gallery-header">
      <span class="mono eyebrow">Forytography · Private Delivery</span>
      <h1 id="clientName">Your Gallery</h1>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <img src="" alt="" id="lightboxImg">
  </div>

<script>
  // Point this at your deployed Worker URL
  const WORKER_URL = "https://forytography-shop.forytographysubdomain.workers.dev";

  // Album slug comes from the link you send the client, e.g. album.html?album=smith-seniors-2026
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("album");

  const lockWrap = document.getElementById("lockWrap");
  const galleryWrap = document.getElementById("galleryWrap");
  const passkeyInput = document.getElementById("passkeyInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const errorMsg = document.getElementById("errorMsg");
  const clientNameEl = document.getElementById("clientName");
  const galleryGrid = document.getElementById("galleryGrid");

  let currentKey = null;
  const SAVED_KEY_STORAGE = "forytography_key";

  async function unlock(prefilledKey){
    const key = prefilledKey || passkeyInput.value.trim();
    if(!slug){
      showError("This link is missing an album — check the URL you were sent.");
      return;
    }
    if(!key){
      showError("Please enter your passkey.");
      return;
    }
    unlockBtn.disabled = true;
    unlockBtn.textContent = "Checking…";
    errorMsg.style.display = "none";

    try {
      const res = await fetch(`${WORKER_URL}/album/access`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug, key })
      });
      const data = await res.json();
      if(!res.ok || !data.ok){
        showError(data.error || "Incorrect passkey.");
        sessionStorage.removeItem(SAVED_KEY_STORAGE);
        unlockBtn.disabled = false;
        unlockBtn.textContent = "View Gallery";
        return;
      }
      currentKey = key;
      sessionStorage.setItem(SAVED_KEY_STORAGE, key);
      showGallery(data);
    } catch(err){
      showError("Could not reach the gallery service. Please try again.");
      unlockBtn.disabled = false;
      unlockBtn.textContent = "View Gallery";
    }
  }

  // If a key was already used this session (e.g. from the Client Work directory
  // or a prior unlock on this album), skip the passkey prompt entirely.
  const savedKey = sessionStorage.getItem(SAVED_KEY_STORAGE);
  if(savedKey && slug){
    passkeyInput.value = savedKey;
    unlock(savedKey);
  }

  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.style.display = "block";
  }

  function showGallery(data){
    lockWrap.style.display = "none";
    galleryWrap.style.display = "block";
    clientNameEl.textContent = data.clientName || "Your Gallery";

    galleryGrid.innerHTML = "";
    data.photos.forEach(photo => {
      const card = document.createElement("div");
      card.className = "photo-card loading";

      const img = document.createElement("img");
      img.alt = photo.file;
      const photoUrl = `${WORKER_URL}/album/photo?slug=${encodeURIComponent(slug)}&file=${encodeURIComponent(photo.file)}`;

      // Images can't send custom headers directly, so fetch with the passkey header
      // and swap the result in as a blob once it's actually loaded.
      fetch(photoUrl, { headers: { "X-Album-Key": currentKey } })
        .then(r => r.blob())
        .then(blob => {
          img.src = URL.createObjectURL(blob);
          card.classList.remove("loading");
        });

      const overlay = document.createElement("div");
      overlay.className = "photo-overlay";
      const btn = document.createElement("button");
      btn.className = "download-btn mono";
      btn.textContent = "Download";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        downloadPhoto(photo.file);
      });
      overlay.appendChild(btn);

      card.addEventListener("click", () => {
        if(img.src) openLightbox(img.src, photo.file);
      });

      card.appendChild(img);
      card.appendChild(overlay);
      galleryGrid.appendChild(card);
    });
  }

  // ---- Lightbox ----
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxClose = document.getElementById("lightboxClose");

  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || "";
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox(){
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightboxImg.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => {
    if(e.target === lightbox){ closeLightbox(); }
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){ closeLightbox(); }
  });

  async function downloadPhoto(file){
    const url = `${WORKER_URL}/album/photo?slug=${encodeURIComponent(slug)}&file=${encodeURIComponent(file)}&download=1`;
    const res = await fetch(url, { headers: { "X-Album-Key": currentKey } });
    const blob = await res.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = file;
    link.click();
  }

  unlockBtn.addEventListener("click", unlock);
  passkeyInput.addEventListener("keydown", (e) => { if(e.key === "Enter") unlock(); });
</script>
</body>
</html>
