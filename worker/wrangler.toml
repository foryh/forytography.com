name = "forytography-shop"
main = "src/index.js"
compatibility_date = "2026-01-01"

# ---- Private storage bucket for your full-resolution, un-watermarked originals ----
# Create this bucket in the Cloudflare dashboard first (R2 -> Create bucket -> name it exactly as below),
# then upload your original photo files into it under an "originals/" folder,
# e.g. originals/DSC_0707.jpg — matching the r2Key values in src/index.js.
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "forytography-originals"

# ---- Client album metadata (which photos belong to which client, passkey hashes) ----
# Create this namespace first: wrangler kv namespace create ALBUM_KV
# Then paste the "id" it prints into this line.
[[kv_namespaces]]
binding = "ALBUM_KV"
id = "7a92a5f216ba4adeb5cf821c910a36a6"

# ---- Non-secret settings ----
[vars]
SITE_URL = "https://forytography.com"
ALLOWED_ORIGIN = "https://forytography.com"
CONTACT_EMAIL = "foryhooste@gmail.com"
# Sender address for intake-form emails and failure alerts. forytography.com is
# verified with Resend (the "send" subdomain in DNS is just Resend's internal
# MX/SPF bounce-handling infra — actual sending uses the root domain below).
FROM_EMAIL = "Forytography <inquiries@forytography.com>"

# The Worker's own public URL — separate from SITE_URL (your site's domain) because
# Prodigi needs a URL it can fetch the print file from directly, not your site's HTML.
SITE_WORKER_URL = "https://forytography-shop.forytographysubdomain.workers.dev"

# Prodigi's sandbox environment — safe for testing, nothing gets printed/shipped/charged.
# Once you're ready to sell real prints: change this to "https://api.prodigi.com" AND
# replace the PRODIGI_API_KEY secret below with a Live key (not Sandbox).
PRODIGI_BASE_URL = "https://api.sandbox.prodigi.com"

# ---- Secret settings (do NOT put these here — set them with the commands below instead) ----
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put ALBUM_MASTER_KEY      <- your personal "always works" passkey
# wrangler secret put RESEND_API_KEY        <- from resend.com, powers the intake form emails
# wrangler secret put PRODIGI_API_KEY       <- from prodigi.com, powers fine-art print fulfillment
